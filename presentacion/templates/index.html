<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcriptor de Audio y Video</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <button id="toggleDarkMode"> Modo Oscuro</button>

    <h2>Sube un archivo de audio o video para transcribir</h2>
    <input type="file" id="videoFile">
    <button id="btnTrans" onclick="subirArchivo()">Transcribir</button>

    <div id="progressContainer" style="display: none;">
        <progress id="progressBar" value="0" max="100"></progress>
    </div>

    <p id="mensaje"></p>

    <button id="descargarTxt" style="display: none;" onclick="descargarTranscripcion('txt')">Descargar .txt</button>
    <button id="descargarPdf" style="display: none;" onclick="descargarTranscripcion('pdf')">Descargar .pdf</button>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
